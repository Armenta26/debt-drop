name: Payment reminders

on:
  schedule:
    - cron: '7 16 * * *'   # every day around 8 AM Pacific (9 AM in summer)
  workflow_dispatch:
    inputs:
      test:
        description: 'Send a test notification to every device'
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --prefix scripts --no-audit --no-fund
      - name: Send reminders
        run: node scripts/send-reminders.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - name: Keep the daily schedule switched on
        if: always()
        run: gh workflow enable reminders.yml || true
        env:
          GH_TOKEN: ${{ github.token }}
